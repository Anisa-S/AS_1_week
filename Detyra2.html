<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Java 1</title>
</head>
<body>
    <p id="numri">0</p>
    <button type="submit" onclick="rritje()">+</button>
    <button type="submit" onclick="zvogelim()">-</button>

    <script>
	var n=0;
        function rritje()
        {
            n=n+1;
            document.getElementById('numri').innerHTML=n;
        }
        function zvogelim()
        {
             n=n-1;
            document.getElementById('numri').innerHTML=n;
        }
    
    </script>
</body>
</html>
